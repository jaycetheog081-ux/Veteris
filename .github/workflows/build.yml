# .github/workflows/build.yml

name: Build Veteris ARM64 Rootful DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Veteris for ARM64
    runs-on: macos-15

    steps:
      - name: Checkout Veteris fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install dpkg
          gem install xcodeproj

      - name: Inspect Xcode project
        run: |
          set -euo pipefail
          xcodebuild -list -project Veteris.xcodeproj
          grep -nE 'IPHONEOS_DEPLOYMENT_TARGET|VALID_ARCHS|ARCHS|MainStoryboard.storyboard|Info.plist|\.gitignore' Veteris.xcodeproj/project.pbxproj || true

      - name: Repair resources and architecture settings
        shell: ruby {0}
        run: |
          require 'xcodeproj'

          project = Xcodeproj::Project.open('Veteris.xcodeproj')

          # Fix project-level and target-level build configurations.
          configurations = project.build_configurations +
                           project.targets.flat_map(&:build_configurations)

          configurations.each do |config|
            settings = config.build_settings

            settings.delete('VALID_ARCHS')
            settings['ARCHS'] = 'arm64'
            settings['ONLY_ACTIVE_ARCH'] = 'YES'
            settings['IPHONEOS_DEPLOYMENT_TARGET'] = '12.0'
          end

          # Remove invalid metadata and duplicate resource references.
          project.targets.each do |target|
            target.build_phases.each do |phase|
              next unless phase.is_a?(
                Xcodeproj::Project::Object::PBXResourcesBuildPhase
              )

              seen_paths = {}

              phase.files.dup.each do |build_file|
                reference = build_file.file_ref
                next unless reference

                reference_path = reference.path.to_s
                basename = File.basename(reference_path)

                # Xcode flattens resources into the app bundle. Multiple
                # .gitignore files therefore collide at the same destination.
                if basename == '.gitignore' || basename == 'Info.plist'
                  phase.files.delete(build_file)
                  next
                end

                real_path = reference.real_path.to_s
                resource_path = real_path.empty? ? reference_path : real_path

                if seen_paths[resource_path]
                  phase.files.delete(build_file)
                else
                  seen_paths[resource_path] = true
                end
              end
            end
          end

          project.save

      - name: Verify repaired project settings
        run: |
          set -euo pipefail

          if grep -n 'VALID_ARCHS' Veteris.xcodeproj/project.pbxproj; then
            echo "::error::VALID_ARCHS remains in project.pbxproj."
            exit 1
          fi

          echo "Legacy architecture setting removed."

      - name: Clean build directory
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

      - name: Build Veteris
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project Veteris.xcodeproj \
            -scheme Veteris \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify ARM64 application
        shell: bash
        run: |
          set -euo pipefail

          APP="build/DerivedData/Build/Products/Release-iphoneos/Veteris.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Veteris.app was not generated."
            find build/DerivedData/Build/Products -maxdepth 5 -print || true
            exit 1
          fi

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist"
          )

          BINARY="$APP/$EXECUTABLE"

          if [ ! -f "$BINARY" ]; then
            echo "::error::App executable is missing: $BINARY"
            exit 1
          fi

          lipo -info "$BINARY"

          if ! lipo -info "$BINARY" | grep -q 'arm64'; then
            echo "::error::The executable does not contain ARM64."
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP/Info.plist"

      - name: Package rootful DEB
        shell: bash
        run: |
          set -euo pipefail

          APP="build/DerivedData/Build/Products/Release-iphoneos/Veteris.app"
          PKG="$GITHUB_WORKSPACE/build/package"

          mkdir -p "$PKG/DEBIAN" "$PKG/Applications"
          cp -R "$APP" "$PKG/Applications/Veteris.app"

          cat > "$PKG/DEBIAN/control" <<'CONTROL'
          Package: com.victorlobe.veteris
          Name: Veteris
          Version: 4.0.1-1
          Architecture: iphoneos-arm64
          Description: Veteris application for jailbroken iOS
          Maintainer: Veteris Fork Maintainers
          Section: Applications
          Priority: optional
          CONTROL

          chmod 0755 "$PKG/DEBIAN"
          chmod 0644 "$PKG/DEBIAN/control"

          dpkg-deb --build --root-owner-group \
            "$PKG" \
            "$GITHUB_WORKSPACE/Veteris-ARM64-rootful.deb"

          dpkg-deb --info \
            "$GITHUB_WORKSPACE/Veteris-ARM64-rootful.deb"

      - name: Upload rootful DEB
        uses: actions/upload-artifact@v4
        with:
          name: Veteris-ARM64-rootful-DEB
          path: Veteris-ARM64-rootful.deb
          if-no-files-found: error
          retention-days: 14
